name: Release

# Standard open-source Electron release flow:
#   1. Bump the version in package.json and push a matching tag, e.g. `v0.1.0`.
#   2. This workflow fans out across macOS / Windows / Linux runners and builds
#      the installers with electron-builder.
#   3. Each job runs `electron-builder --publish always`, which creates (or
#      appends to) a single DRAFT GitHub Release keyed on the tag and uploads
#      its installers there — mac x64 + arm64, Windows x64, Linux x64.
#   4. A maintainer reviews the drafted release, writes the notes, and publishes.
#
# A manual `workflow_dispatch` run builds every installer but publishes nothing —
# use it to smoke-test packaging on all platforms without cutting a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create/update the GitHub Release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple: build BOTH Intel (x64) and Apple Silicon (arm64).
          - os: macos-latest
            build_args: --mac --x64 --arm64
          # Windows: x64 installer.
          - os: windows-latest
            build_args: --win --x64
          # Linux: x64 AppImage + .deb.
          - os: ubuntu-latest
            build_args: --linux --x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer + main
        run: pnpm build

      - name: Package installers
        # On a tag push -> publish to the draft GitHub Release.
        # On a manual run -> build only, publish nothing.
        run: >-
          pnpm exec electron-builder ${{ matrix.build_args }}
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This is an unsigned community build: don't let electron-builder try
          # to auto-discover an Apple signing identity (there is none in CI) and
          # fail the mac job. Remove once real signing certs are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Keep the raw installers as workflow artifacts too — handy for
      # workflow_dispatch test runs where nothing is published to a Release.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.yml
          if-no-files-found: ignore
